prior:
  cmb_compressed: true
  matter_dom: 'lambda w, wa: 0 if w + wa < 0 else -np.inf'
params:
  ombh2:
    prior:
      min: 0.015
      max: 0.03
    ref: 0.02223
    proposal: 0.0001
    latex: \omega_\mathrm{b}
    renames:
    - omegabh2
  omch2:
    prior:
      min: 0.05
      max: 0.25
    ref: 0.1198
    proposal: 0.001
    latex: \omega_\mathrm{c}
    renames:
    - omegach2
  theta_star_100:
    prior:
      min: 1.0
      max: 1.1
    ref: 1.041
    proposal: 0.0002
    latex: 100\theta_\ast
  thetastar:
    value: 'lambda theta_star_100: 1e-2*theta_star_100'
    derived: true
  w:
    prior:
      min: -3.0
      max: 1.0
    ref: -0.8
    proposal: 0.05
    latex: w_0
  wa:
    prior:
      min: -3.0
      max: 2.0
    ref: -0.8
    proposal: 0.1
    latex: w_a
  mnu:
    value: 0.06
  H0:
    latex: H_0
    derived: true
  omegam:
    latex: \Omega_\mathrm{m}
    derived: true
  rdrag:
    latex: r_\mathrm{d}
    derived: true
  chi2__BAO:
    latex: \chi^2_\mathrm{BAO}
    derived: true
  chi2__SN:
    latex: \chi^2_\mathrm{SN}
    derived: true
sampler:
  mcmc:
    sampler_type: mcmc
    supports_periodic_params: true
    burn_in: 0
    max_tries: 100000
    covmat: null
    covmat_params: null
    proposal_scale: 2.4
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: .inf
    Rminus1_stop: 0.002
    Rminus1_cl_stop: 0.02
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - ombh2
        - omch2
        - theta_star_100
        - w
        - wa
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: 3.6.2
output: cmb_pantheonplus
